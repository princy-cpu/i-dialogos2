# Retour manuel à la version précédente (onglet Actions > Retour arrière > Run workflow).
name: Retour arrière

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environnement à remettre sur la version précédente
        type: choice
        options: [preprod, production]
        default: production

permissions:
  contents: read

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  rollback:
    name: Retour arrière (${{ inputs.target }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy
        with:
          action: rollback
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          ssh-host: ${{ vars.SSH_HOST }}
          ssh-user: ${{ vars.SSH_USER }}
          ssh-port: ${{ vars.SSH_PORT }}
          deploy-path: ${{ inputs.target == 'production' && vars.PROD_DEPLOY_PATH || vars.PREPROD_DEPLOY_PATH }}
          site-url: ${{ inputs.target == 'production' && vars.PROD_SITE_URL || vars.PREPROD_SITE_URL }}
          venv-path: ${{ inputs.target == 'production' && vars.PROD_VENV_PATH || vars.PREPROD_VENV_PATH }}
