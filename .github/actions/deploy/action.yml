name: Déploiement LWS
description: Prépare la connexion SSH (et, chez o2switch, autorise l'adresse IP de GitHub le temps du job), puis lance deploy/deploy.sh.

inputs:
  action:
    description: deploy ou rollback
    default: deploy
  ssh-private-key:
    description: clé privée de déploiement (si le serveur accepte les clés)
    default: ''
  ssh-password:
    description: mot de passe SSH (offre LWS Starter, où l'on ne peut pas déposer de clé)
    default: ''
  ssh-known-hosts:
    description: empreinte du serveur (sortie de ssh-keyscan), pour refuser un serveur usurpé
    required: true
  deploy-token:
    description: jeton partagé avec le serveur (DEPLOY_TOKEN de .app/shared/app.env)
    required: true
  ssh-host:
    required: true
  ssh-user:
    required: true
  ssh-port:
    default: '22'
  deploy-path:
    description: dossier web dans le compte (htdocs)
    required: true
  site-url:
    required: true
  site-ip:
    description: adresse IP du serveur, tant que le domaine ne pointe pas encore vers LWS
    default: ''
  allow-no-backup:
    default: 'false'
  cpanel-api-token:
    description: jeton d'API cPanel (o2switch) pour autoriser l'adresse IP de GitHub dans le pare-feu SSH ; vide ailleurs
    default: ''

runs:
  using: composite
  steps:
    - name: Connexion SSH
      shell: bash
      env:
        KEY: ${{ inputs.ssh-private-key }}
        PASSWORD: ${{ inputs.ssh-password }}
        KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      run: |
        if [ -z "$KEY" ] && [ -z "$PASSWORD" ]; then
          echo "::error::Renseigner le secret SSH_PASSWORD (ou SSH_PRIVATE_KEY)."
          exit 1
        fi
        install -m 700 -d ~/.ssh
        if [ -n "$KEY" ]; then
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
        fi
        if [ -n "$PASSWORD" ] && ! command -v sshpass >/dev/null; then
          sudo apt-get install -y -qq sshpass >/dev/null
        fi
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
    - name: Autorisation SSH temporaire (o2switch)
      if: inputs.cpanel-api-token != ''
      shell: bash
      env:
        API: https://${{ inputs.ssh-host }}:2083/execute/SshWhitelist
        AUTH: cpanel ${{ inputs.ssh-user }}:${{ inputs.cpanel-api-token }}
      run: |
        ip="$(curl -fsS --max-time 20 https://api.ipify.org)"
        echo "RUNNER_IP=$ip" >> "$GITHUB_ENV"
        echo "Autorisation de l'adresse $ip sur le port 22 (jusqu'à 35 secondes)"
        answer="$(curl -sS --max-time 90 -H "Authorization: $AUTH" "$API/add?address=$ip&port=22" || true)"
        if ! grep -Eq '"status" *: *1([^0-9]|$)' <<< "$answer"; then
          echo "::error::Autorisation SSH refusée par o2switch : $answer"
          echo "Vérifier le secret CPANEL_API_TOKEN, et qu'il reste une place libre (5 au maximum) dans l'outil « Autorisation SSH » de cPanel."
          exit 1
        fi
        for _ in 1 2 3 4 5 6; do
          [[ "$(curl -sS --max-time 20 -H "Authorization: $AUTH" "$API/list" || true)" == *"\"$ip\""* ]] && exit 0
          sleep 10
        done
        echo "::error::L'adresse $ip n'apparaît pas dans la liste des autorisations SSH."
        exit 1
    - name: ${{ inputs.action == 'rollback' && 'Retour arrière' || 'Déploiement' }}
      shell: bash
      env:
        ACTION: ${{ inputs.action }}
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PORT: ${{ inputs.ssh-port || '22' }}
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        SITE_URL: ${{ inputs.site-url }}
        SITE_IP: ${{ inputs.site-ip }}
        DEPLOY_TOKEN: ${{ inputs.deploy-token }}
        SSH_PASSWORD: ${{ inputs.ssh-password }}
        ALLOW_NO_BACKUP: ${{ inputs.allow-no-backup == 'true' && '1' || '0' }}
      run: |
        if [ -f "$HOME/.ssh/id_deploy" ]; then export SSH_KEY_FILE="$HOME/.ssh/id_deploy"; fi
        bash deploy/deploy.sh "$ACTION"
    - name: Effacer la clé
      if: always()
      shell: bash
      run: rm -f ~/.ssh/id_deploy
    - name: Retrait de l'autorisation SSH (o2switch)
      if: always() && inputs.cpanel-api-token != ''
      shell: bash
      env:
        API: https://${{ inputs.ssh-host }}:2083/execute/SshWhitelist
        AUTH: cpanel ${{ inputs.ssh-user }}:${{ inputs.cpanel-api-token }}
      run: |
        [ -n "${RUNNER_IP:-}" ] || exit 0
        for direction in in out; do
          curl -sS --max-time 30 -o /dev/null -H "Authorization: $AUTH" \
            "$API/remove?address=$RUNNER_IP&port=22&direction=$direction" || true
        done
        echo "Autorisation de $RUNNER_IP retirée."
