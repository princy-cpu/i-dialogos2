name: Déploiement LWS
description: Prépare la connexion SSH puis lance deploy/deploy.sh (déploiement ou retour arrière).

inputs:
  action:
    description: deploy ou rollback
    default: deploy
  ssh-private-key:
    required: true
  ssh-known-hosts:
    description: empreinte du serveur (sortie de ssh-keyscan), pour refuser un serveur usurpé
    required: true
  ssh-host:
    required: true
  ssh-user:
    required: true
  ssh-port:
    default: '22'
  deploy-path:
    required: true
  site-url:
    required: true
  venv-path:
    default: ''

runs:
  using: composite
  steps:
    - name: Connexion SSH
      shell: bash
      env:
        KEY: ${{ inputs.ssh-private-key }}
        KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
    - name: ${{ inputs.action == 'rollback' && 'Retour arrière' || 'Déploiement' }}
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PORT: ${{ inputs.ssh-port || '22' }}
        SSH_KEY_FILE: ~/.ssh/id_deploy
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        SITE_URL: ${{ inputs.site-url }}
        VENV_PATH: ${{ inputs.venv-path }}
      run: |
        export SSH_KEY_FILE="$HOME/.ssh/id_deploy"
        bash deploy/deploy.sh "${{ inputs.action }}"
    - name: Effacer la clé
      if: always()
      shell: bash
      run: rm -f ~/.ssh/id_deploy
